name: Telegram School Solver Bot 24/7

on:
  schedule:
    # Запуск каждые 5 часов (в 0-ю минуту каждого 5-го часа)
    - cron: '0 */5 * * *'
  # Позволяет запускать вручную из вкладки Actions на GitHub
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Копируем репозиторий
      uses: actions/checkout@v4

    - name: 🐍 Настраиваем Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Устанавливаем зависимости
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🛑 Останавливаем старые копии бота (если оставались)
      run: |
        pkill -f bot.py || true

    - name: 🚀 Запускаем бота в фоновом режиме
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        nohup python bot.py > bot.log 2>&1 &
        echo "Бот успешно запущен на GitHub Actions!"
